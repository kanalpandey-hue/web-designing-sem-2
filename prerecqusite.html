<!DOCTYPE html>
<html>
<head>
    <title>Hill Climb Racing 2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(to bottom right, #00c6ff, #ff2e88);
            color: white;
        }

        .game-img {
            width: 250px;
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.4);
        }

        .play-btn {
            margin-top: 20px;
            padding: 15px 50px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background-color: white;
            color: black;
            cursor: pointer;
            transition: 0.3s;
        }

        .play-btn:hover {
            background-color: #ddd;
            transform: scale(1.05);
        }

        h1 {
            margin-top: 40px;
            font-weight: normal;
        }

        p {
            width: 80%;
            max-width: 500px;
        }
    </style>
</head>

<body>

    <img src="unnamed.webp" class="game-img">

    <h1>HILL CLIMB RACING 2</h1>

    <p>
        Control your car or bike to climb hills with realistic control.
        Collect coins, perform tricks and upgrade your vehicle to reach.
        </p>
