<!DOCTYPE html>
<html>
<head>
    <title>choose map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(to bottom right, #00c6ff, #ff2e88);
            color: white;
        }

        .top-bar{
            width: 100%;
            height: 60px;
            background-color: rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .map-container{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }
        .map-card{
            width: 200px;
            height: 150px;
            background-color: rgba(255,255,255,0.2);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .map-card:hover {
            background-color: rgba(255,255,255,0.4);
            transform: scale(1.05);
        }
        .btn{
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background-color: white;
            color: black;
            cursor: pointer;
            transition: 0.3s;
        
        }
        .btn:hover {
            background-color: #ddd;
            transform: scale(1.05);
        }
        @media (max-width: 600px) {
            .map-card {
                width: 100%;
                height: 120px;
            }
        }
        </style>
</head>
<body>
    <div class="top-bar">
        <h2>Choose Map</h2>
        <button class="btn">Back</button>
    </div>
    <div class="map-container">
        <div class="map-card">Map 1</div>
        <div class="map-card">Map 2</div>
        <div class="map-card">Map 3</div>
        <div class="map-card">Map 4</div>
    </div>
</body>
